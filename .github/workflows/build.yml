name: Build CatBrowser Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Clone Webview Headers
      shell: cmd
      run: |
        git clone --depth 1 https://github.com/webview/webview.git temp_webview

    - name: Download Microsoft WebView2 SDK
      shell: powershell
      run: |
        nuget install Microsoft.Web.WebView2 -OutputDirectory webview2_sdk
        $inc = (Get-ChildItem -Path "webview2_sdk" -Filter "include" -Recurse | Select-Object -First 1).FullName
        Write-Output "WEBVIEW2_INC=$inc" >> $env:GITHUB_ENV

    - name: Compile Standalone CatBrowser.exe
      shell: cmd
      run: |
        g++ main.cpp -o CatBrowser.exe -std=c++14 -DWEBVIEW_WINAPI -Itemp_webview/core/include -Itemp_webview/core/include/webview -I"%WEBVIEW2_INC%" -static -static-libgcc -static-libstdc++ -lshlwapi -lole32 -loleaut32 -luuid -lshell32 -lgdi32 -lversion -lcomctl32 -mwindows 2>&1

    - name: Upload Finished Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CatBrowser-Windows
        path: |
          CatBrowser.exe
          cathome.html
          sammy.html
          sammy_2.png

    - name: Output Artifact Page URL
      shell: bash
      run: |
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "### Artifact Download Location" >> $GITHUB_STEP_SUMMARY
        echo "You can download **CatBrowser-Windows** at the bottom of this page:" >> $GITHUB_STEP_SUMMARY
        echo "[$RUN_URL]($RUN_URL)" >> $GITHUB_STEP_SUMMARY
